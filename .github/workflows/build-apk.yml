                                    Text(if (isAr) "الخزانة فارغة. اضغط «إضافة درج هدف» بالأسفل!" else "Cabinet empty. Tap 'Add Goal Drawer' below!", color = Color.White, textAlign = TextAlign.Center)
                                }
                            } else {
                                active.forEachIndexed { idx, g ->
                                    val pCount = pages.count { it.goalId == g.id }
                                    Column {
                                        Box(Modifier.fillMaxWidth().height(4.dp).background(Color.Black.copy(alpha = 0.35f)))
                                        TactileDrawer(g, idx + 1, pCount, isAr, false, { onOpen(g) }, { onEdit(g) }, { onStatus(g, "COMPLETED") }, { onStatus(g, "ARCHIVED") }, { onDelete(g) })
                                        Box(Modifier.fillMaxWidth().height(8.dp).background(Brush.verticalGradient(listOf(woodFrame, Color.Black.copy(alpha = 0.35f)))))
                                    }
                                }
                            }
                        }
                    }
                    // Cabinet Base Plinth & Feet
                    Box(Modifier.fillMaxWidth().height(15.dp).clip(RoundedCornerShape(bottomStart = 10.dp, bottomEnd = 10.dp)).background(Brush.verticalGradient(listOf(crown, Color(0xFF121A2A)))).border(2.dp, Color(0xFF9C8B70), RoundedCornerShape(bottomStart = 10.dp, bottomEnd = 10.dp)))
                    Row(Modifier.fillMaxWidth().padding(horizontal = 24.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                        Box(Modifier.width(42.dp).height(12.dp).clip(RoundedCornerShape(bottomStart = 8.dp, bottomEnd = 8.dp)).background(Color(0xFF192438)).border(1.dp, Color(0xFF9C8B70), RoundedCornerShape(bottomStart = 8.dp, bottomEnd = 8.dp)))
                        Box(Modifier.width(42.dp).height(12.dp).clip(RoundedCornerShape(bottomStart = 8.dp, bottomEnd = 8.dp)).background(Color(0xFF192438)).border(1.dp, Color(0xFF9C8B70), RoundedCornerShape(bottomStart = 8.dp, bottomEnd = 8.dp)))
                    }
                    Spacer(Modifier.height(90.dp))
                }
            }
        }

        @Composable
        fun TactileDrawer(goal: GoalEntity, idx: Int, pageCount: Int, isAr: Boolean, preview: Boolean = false, onOpen: () -> Unit = {}, onEdit: () -> Unit = {}, onComplete: () -> Unit = {}, onArchive: () -> Unit = {}, onDelete: () -> Unit = {}) {
            val scope = rememberCoroutineScope()
            var pulled by remember { mutableStateOf(false) }
            var menu by remember { mutableStateOf(false) }
            val scale by animateFloatAsState(if (pulled) 1.035f else 1f, spring(dampingRatio = Spring.DampingRatioMediumBouncy), label = "s")
            val base = Color(goal.color)
            val edge = Color((base.red * 0.82f).coerceIn(0f, 1f), (base.green * 0.82f).coerceIn(0f, 1f), (base.blue * 0.85f).coerceIn(0f, 1f), 1f)
            val df = remember { SimpleDateFormat("yyyy/MM/dd", Locale.getDefault()) }

            Column(Modifier.fillMaxWidth().scale(scale)) {
                if (pageCount > 0) {
                    Row(Modifier.fillMaxWidth().padding(horizontal = 22.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                        repeat(pageCount.coerceAtMost(3)) {
                            Box(Modifier.weight(1f).height(if (pulled) 13.dp else 6.dp).clip(RoundedCornerShape(topStart = 4.dp, topEnd = 4.dp)).background(Color(0xFFFFFDF9)).border(0.8.dp, Color(0xFFB0A89B), RoundedCornerShape(topStart = 4.dp, topEnd = 4.dp)))
                        }
                    }
                }
                AnimatedVisibility(pulled) {
                    Box(Modifier.fillMaxWidth().padding(horizontal = 10.dp).height(22.dp).background(Color(0xFF2B2620)).border(1.dp, Color(0xFF7D6B52)), contentAlignment = Alignment.Center) {
                        Text(if (isAr) "📂 جاري سحب الدرج وفتح الدفتر..." else "📂 Pulling drawer & opening notebook...", color = Color(0xFFFFE082), fontSize = 11.sp, fontWeight = FontWeight.Bold)
                    }
                }
                Surface(
                    modifier = Modifier.fillMaxWidth().clickable(!preview) { scope.launch { pulled = true; delay(200); pulled = false; onOpen() } },
                    shape = RoundedCornerShape(12.dp), shadowElevation = if (pulled) 14.dp else 5.dp, color = base, border = BorderStroke(2.dp, edge)
                ) {
                    Box(Modifier.padding(6.dp).clip(RoundedCornerShape(9.dp)).background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.45f), base, edge.copy(alpha = 0.35f)))).border(1.2.dp, Color(0xFF1B2A4A).copy(alpha = 0.22f), RoundedCornerShape(9.dp)).padding(horizontal = 12.dp, vertical = 10.dp)) {
                        Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                    Rivet()
                                    Surface(shape = RoundedCornerShape(5.dp), color = Color(0xFFFDFBF7), border = BorderStroke(1.5.dp, Color(0xFF8C734B))) {
                                        Row(Modifier.padding(horizontal = 8.dp, vertical = 2.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                            Text("#${idx.toString().padStart(2, '0')}", fontWeight = FontWeight.Black, fontSize = 11.sp, color = Color(0xFF5D4622))
                                            Text(if (isAr) "$pageCount صفحات" else "$pageCount Pages", fontWeight = FontWeight.Bold, fontSize = 11.sp, color = Color(0xFF1B2A4A))
                                        }
                                    }
                                }
                                Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                    Text(df.format(Date(goal.updatedAt)), fontSize = 10.sp, color = Color(0xFF1B2A4A).copy(alpha = 0.65f))
                                    if (!preview) Box {
                                        IconButton(onClick = { menu = true }, modifier = Modifier.size(24.dp)) { Icon(Icons.Default.MoreVert, null, tint = Color(0xFF1B2A4A), modifier = Modifier.size(18.dp)) }
                                        DropdownMenu(menu, { menu = false }) {
                                            DropdownMenuItem(text = { Text(if (isAr) "فتح الدفتر" else "Open") }, onClick = { menu = false; onOpen() })
                                            DropdownMenuItem(text = { Text(if (isAr) "تعديل الدرج" else "Edit") }, onClick = { menu = false; onEdit() })
                                            DropdownMenuItem(text = { Text(if (isAr) "تحديد كمكتمل" else "Complete") }, onClick = { menu = false; onComplete() })
                                            DropdownMenuItem(text = { Text(if (isAr) "نقل للأرشيف" else "Archive") }, onClick = { menu = false; onArchive() })
                                            DropdownMenuItem(text = { Text(if (isAr) "حذف الدرج" else "Delete", color = Color(0xFFC62828)) }, onClick = { menu = false; onDelete() })
                                        }
                                    }
                                    Rivet()
                                }
                            }
                            Row(Modifier.fillMaxWidth().padding(horizontal = 4.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                                Surface(shape = RoundedCornerShape(12.dp), color = Color(0xFF1B2A4A), border = BorderStroke(1.5.dp, Color(0xFFD9B872)), shadowElevation = 3.dp, modifier = Modifier.size(44.dp)) {
                                    Box(contentAlignment = Alignment.Center) { Icon(drawerIcons[goal.icon] ?: Icons.Default.Star, null, tint = Color(0xFFFFDF8E), modifier = Modifier.size(24.dp)) }
                                }
                                Column(Modifier.weight(1f)) {
                                    Text(goal.title.ifBlank { if (isAr) "اسم الهدف..." else "Goal Title..." }, fontWeight = FontWeight.Black, fontSize = 17.sp, color = Color(0xFF1B2A4A), maxLines = 1, overflow = TextOverflow.Ellipsis)
                                    if (goal.description.isNotBlank()) Text(goal.description, fontSize = 12.sp, color = Color(0xFF2D3E5E), maxLines = 1, overflow = TextOverflow.Ellipsis)
                                }
                            }
                            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.SpaceBetween) {
                                Rivet()
                                Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.shadow(4.dp, RoundedCornerShape(10.dp)).clip(RoundedCornerShape(10.dp)).background(Brush.verticalGradient(listOf(Color(0xFFF5ECE0), Color(0xFFB5A38A), Color(0xFF6B5B45)))).border(1.2.dp, Color(0xFF4A3D2C), RoundedCornerShape(10.dp)).padding(horizontal = 8.dp, vertical = 4.dp)) {
                                    Box(Modifier.size(7.dp).clip(CircleShape).background(Color(0xFF3E3325)))
                                    Box(Modifier.width(72.dp).height(6.dp).padding(horizontal = 6.dp).clip(CircleShape).background(Brush.verticalGradient(listOf(Color.White, Color(0xFFC7B69E), Color(0xFF5A4C39)))))
                                    Box(Modifier.size(7.dp).clip(CircleShape).background(Color(0xFF3E3325)))
                                }
                                Rivet()
                            }
                        }
                    }
                }
            }
        }

