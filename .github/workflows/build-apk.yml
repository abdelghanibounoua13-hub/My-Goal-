        @Entity(tableName = "goals")
        data class GoalEntity(
            @PrimaryKey val id: String = UUID.randomUUID().toString(),
            val title: String, val description: String = "", val icon: String = "Star",
            val color: Long = 0xFFE6EEF8, val status: String = "ACTIVE",
            val createdAt: Long = System.currentTimeMillis(), val updatedAt: Long = System.currentTimeMillis()
        )

        @Entity(tableName = "notebook_pages", foreignKeys = [ForeignKey(entity = GoalEntity::class, parentColumns = ["id"], childColumns = ["goalId"], onDelete = ForeignKey.CASCADE)], indices = [Index("goalId")])
        data class NotebookPageEntity(
            @PrimaryKey val id: String = UUID.randomUUID().toString(),
            val goalId: String, val title: String, val content: String = "", val plainText: String = "",
            val pageOrder: Int = 0, val createdAt: Long = System.currentTimeMillis(), val updatedAt: Long = System.currentTimeMillis()
        )

        @Dao
        interface MyGoalDao {
            @Query("SELECT * FROM goals ORDER BY updatedAt DESC") fun getAllGoals(): Flow<List<GoalEntity>>
            @Query("SELECT * FROM notebook_pages ORDER BY pageOrder ASC, updatedAt DESC") fun getAllPages(): Flow<List<NotebookPageEntity>>
            @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun saveGoal(goal: GoalEntity)
            @Delete suspend fun deleteGoal(goal: GoalEntity)
            @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun savePage(page: NotebookPageEntity)
            @Delete suspend fun deletePage(page: NotebookPageEntity)
            @Query("DELETE FROM goals") suspend fun clearAllGoals()
        }

        @Database(entities = [GoalEntity::class, NotebookPageEntity::class], version = 3, exportSchema = false)
        abstract class MyGoalDatabase : RoomDatabase() { abstract fun dao(): MyGoalDao }

        val drawerPalette = listOf(
            Triple(0xFFE6EEF8, "أزرق ضبابي", "Mist Blue"), Triple(0xFFEDE8F8, "لافندر ناعم", "Lavender"),
            Triple(0xFFE6F4EA, "أخضر مريمي", "Sage Mint"), Triple(0xFFFFF2DE, "كهرماني دافئ", "Warm Amber"),
            Triple(0xFFFCE8E8, "وردي هادئ", "Blush Rose"), Triple(0xFFE3F4F4, "تركواز هادئ", "Calm Teal"),
            Triple(0xFFF4EFE6, "رملي دافئ", "Sandstone"), Triple(0xFFEFE8F4, "أوركيد فاتح", "Orchid")
        )

        val drawerIcons = linkedMapOf(
            "Star" to Icons.Default.Star, "Book" to Icons.Default.MenuBook, "Language" to Icons.Default.Language,
            "Fitness" to Icons.Default.FitnessCenter, "Business" to Icons.Default.Work, "Code" to Icons.Default.Code,
            "Lightbulb" to Icons.Default.Lightbulb, "School" to Icons.Default.School, "Brush" to Icons.Default.Brush,
            "Savings" to Icons.Default.Savings, "Explore" to Icons.Default.Explore, "Psychology" to Icons.Default.Psychology,
            "Music" to Icons.Default.MusicNote, "Rocket" to Icons.Default.RocketLaunch, "Heart" to Icons.Default.Favorite,
            "Trophy" to Icons.Default.EmojiEvents
        )

        data class PageBlock(val id: String = UUID.randomUUID().toString(), val type: String = "PARAGRAPH", val text: String = "", val checked: Boolean = false, val extra: String = "")

        object Codec {
            fun decode(raw: String): List<PageBlock> = runCatching {
                if (raw.isBlank()) return listOf(PageBlock())
                val arr = JSONArray(raw)
                List(arr.length()) { i ->
                    val o = arr.getJSONObject(i)
                    PageBlock(o.optString("id", UUID.randomUUID().toString()), o.optString("type", "PARAGRAPH"), o.optString("text"), o.optBoolean("checked"), o.optString("extra"))
                }.ifEmpty { listOf(PageBlock()) }
            }.getOrElse { listOf(PageBlock(text = raw)) }

            fun encode(list: List<PageBlock>): String = JSONArray().apply {
                list.forEach { b -> put(JSONObject().apply { put("id", b.id); put("type", b.type); put("text", b.text); put("checked", b.checked); put("extra", b.extra) }) }
            }.toString()

            fun plain(list: List<PageBlock>) = list.joinToString("\n") { "${it.text} ${it.extra}" }.trim()

            fun decodeTable(s: String): List<List<String>> = runCatching {
                val r = JSONArray(s)
                List(r.length()) { i -> val c = r.getJSONArray(i); List(c.length()) { j -> c.optString(j) } }
            }.getOrElse { listOf(listOf("البند", "التفاصيل"), listOf("", "")) }

            fun encodeTable(g: List<List<String>>): String = JSONArray().apply { g.forEach { r -> put(JSONArray(r)) } }.toString()
        }

        class RichTransform : VisualTransformation {
            override fun filter(text: AnnotatedString): TransformedText {
                val s = text.text; val b = AnnotatedString.Builder(s); val dim = SpanStyle(color = Color.Gray.copy(alpha = 0.4f))
                Regex("\\*\\*(.+?)\\*\\*").findAll(s).forEach { m -> b.addStyle(SpanStyle(fontWeight = FontWeight.Black), m.range.first, m.range.last + 1); b.addStyle(dim, m.range.first, m.range.first + 2); b.addStyle(dim, m.range.last - 1, m.range.last + 1) }
                Regex("(?<!\\*)\\*(?!\\*)(.+?)(?<!\\*)\\*(?!\\*)").findAll(s).forEach { m -> b.addStyle(SpanStyle(fontStyle = FontStyle.Italic), m.range.first, m.range.last + 1) }
                Regex("__(.+?)__").findAll(s).forEach { m -> b.addStyle(SpanStyle(textDecoration = TextDecoration.Underline), m.range.first, m.range.last + 1) }
                Regex("==(.+?)==").findAll(s).forEach { m -> b.addStyle(SpanStyle(background = Color(0xFFFFF099), color = Color(0xFF1B2A4A)), m.range.first, m.range.last + 1) }
                Regex("\\[(.+?)]\\((.+?)\\)").findAll(s).forEach { m -> b.addStyle(SpanStyle(color = Color(0xFF3D5AFE), textDecoration = TextDecoration.Underline, fontWeight = FontWeight.Bold), m.range.first, m.range.last + 1) }
                return TransformedText(b.toAnnotatedString(), OffsetMapping.Identity)
            }
        }

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val db = Room.databaseBuilder(applicationContext, MyGoalDatabase::class.java, "my_goal_cabinet.db").fallbackToDestructiveMigration().build()
                val prefs = getSharedPreferences("mygoal_prefs", Context.MODE_PRIVATE)
                setContent {
                    var isAr by remember { mutableStateOf(prefs.getBoolean("is_ar", true)) }
                    var isDark by remember { mutableStateOf(prefs.getBoolean("is_dark", false)) }
                    var ruled by remember { mutableStateOf(prefs.getBoolean("ruled", true)) }
                    val scheme = if (isDark) darkColorScheme(primary = Color(0xFFA6BEFF), secondary = Color(0xFF8C84FF), background = Color(0xFF0F141F), surface = Color(0xFF1A2132))
                    else lightColorScheme(primary = Color(0xFF1B2A4A), secondary = Color(0xFF6C63FF), background = Color(0xFFFAF8F5), surface = Color(0xFFEDE8DF))
                    CompositionLocalProvider(LocalLayoutDirection provides if (isAr) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                        MaterialTheme(colorScheme = scheme) {
                            Surface(Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                MyGoalApp(db.dao(), isAr, isDark, ruled,
                                    { isAr = it; prefs.edit().putBoolean("is_ar", it).apply() },
                                    { isDark = it; prefs.edit().putBoolean("is_dark", it).apply() },
                                    { ruled = it; prefs.edit().putBoolean("ruled", it).apply() })
                            }
                        }
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun MyGoalApp(dao: MyGoalDao, isAr: Boolean, isDark: Boolean, ruled: Boolean, onLang: (Boolean) -> Unit, onTheme: (Boolean) -> Unit, onRuled: (Boolean) -> Unit) {
            val scope = rememberCoroutineScope(); val ctx = LocalContext.current
            val goals by dao.getAllGoals().collectAsState(emptyList())
            val allPages by dao.getAllPages().collectAsState(emptyList())
            var screen by remember { mutableStateOf("home") }
            var goalId by remember { mutableStateOf<String?>(null) }
            var pageId by remember { mutableStateOf<String?>(null) }
            var editGoal by remember { mutableStateOf<GoalEntity?>(null) }
            var query by remember { mutableStateOf("") }
            var delGoal by remember { mutableStateOf<GoalEntity?>(null) }
            var delPage by remember { mutableStateOf<NotebookPageEntity?>(null) }

            val active = goals.filter { it.status == "ACTIVE" }
            val completed = goals.filter { it.status == "COMPLETED" }
            val archived = goals.filter { it.status == "ARCHIVED" }
            val curGoal = goals.find { it.id == goalId }
            val goalPages = allPages.filter { it.goalId == goalId }.sortedBy { it.pageOrder }
            val curPage = allPages.find { it.id == pageId }

            BackHandler(screen != "home") { screen = if (screen == "editor") "notebook" else "home" }

            val exporter = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { u ->
                u?.let {
                    scope.launch(Dispatchers.IO) {
                        val imgs = JSONObject()
                        File(ctx.filesDir, "notebook_images").listFiles()?.forEach { f -> imgs.put(f.name, Base64.encodeToString(f.readBytes(), Base64.NO_WRAP)) }
                        val root = JSONObject().apply {
                            put("goals", JSONArray().apply { goals.forEach { g -> put(JSONObject().apply { put("id", g.id); put("title", g.title); put("description", g.description); put("icon", g.icon); put("color", g.color); put("status", g.status); put("createdAt", g.createdAt); put("updatedAt", g.updatedAt) }) } })
                            put("pages", JSONArray().apply { allPages.forEach { p -> put(JSONObject().apply { put("id", p.id); put("goalId", p.goalId); put("title", p.title); put("content", p.content); put("plainText", p.plainText); put("pageOrder", p.pageOrder); put("updatedAt", p.updatedAt) }) } })
                            put("images", imgs)
                        }
                        ctx.contentResolver.openOutputStream(it)?.use { o -> o.write(root.toString(2).toByteArray()) }
                        withContext(Dispatchers.Main) { Toast.makeText(ctx, if (isAr) "تم حفظ النسخة الاحتياطية ✓" else "Backup Saved ✓", Toast.LENGTH_SHORT).show() }
                    }
                }
            }

            val importer = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { u ->
                u?.let {
                    scope.launch(Dispatchers.IO) {
                        runCatching {
                            val root = JSONObject(ctx.contentResolver.openInputStream(it)?.bufferedReader()?.readText() ?: "")
                            val dir = File(ctx.filesDir, "notebook_images").apply { mkdirs() }
                            root.optJSONObject("images")?.let { im -> im.keys().forEach { k -> File(dir, k).writeBytes(Base64.decode(im.getString(k), Base64.DEFAULT)) } }
                            dao.clearAllGoals()
                            val ga = root.getJSONArray("goals"); for (i in 0 until ga.length()) { val o = ga.getJSONObject(i); dao.saveGoal(GoalEntity(o.getString("id"), o.getString("title"), o.optString("description"), o.optString("icon", "Star"), o.optLong("color", 0xFFE6EEF8), o.optString("status", "ACTIVE"), o.optLong("createdAt"), o.optLong("updatedAt"))) }
                            val pa = root.getJSONArray("pages"); for (i in 0 until pa.length()) { val o = pa.getJSONObject(i); dao.savePage(NotebookPageEntity(o.getString("id"), o.getString("goalId"), o.getString("title"), o.optString("content"), o.optString("plainText"), o.optInt("pageOrder", i), updatedAt = o.optLong("updatedAt"))) }
                            withContext(Dispatchers.Main) { Toast.makeText(ctx, if (isAr) "تمت الاستعادة بنجاح ✓" else "Restored ✓", Toast.LENGTH_SHORT).show() }
                        }
                    }
                }
            }

            if (delGoal != null) AlertDialog(onDismissRequest = { delGoal = null }, title = { Text(if (isAr) "حذف الدرج نهائياً؟" else "Delete Drawer?") }, text = { Text(delGoal!!.title) }, confirmButton = { Button(colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828)), onClick = { val g = delGoal!!; delGoal = null; scope.launch { dao.deleteGoal(g); screen = "home" } }) { Text(if (isAr) "حذف" else "Delete") } }, dismissButton = { OutlinedButton(onClick = { delGoal = null }) { Text(if (isAr) "إلغاء" else "Cancel") } })
            if (delPage != null) AlertDialog(onDismissRequest = { delPage = null }, title = { Text(if (isAr) "حذف الصفحة؟" else "Delete Page?") }, text = { Text(delPage!!.title) }, confirmButton = { Button(colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFC62828)), onClick = { val p = delPage!!; delPage = null; scope.launch { dao.deletePage(p) } }) { Text(if (isAr) "حذف" else "Delete") } }, dismissButton = { OutlinedButton(onClick = { delPage = null }) { Text(if (isAr) "إلغاء" else "Cancel") } })

            Scaffold(
                topBar = {
                    if (screen != "editor") TopAppBar(
                        title = {
                            Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Surface(shape = RoundedCornerShape(8.dp), color = Color(0xFF1B2A4A)) { Icon(Icons.Default.Inventory2, null, tint = Color(0xFFFFD54F), modifier = Modifier.padding(6.dp).size(18.dp)) }
                                Column {
                                    Text("MY GOAL", fontWeight = FontWeight.Black, fontSize = 17.sp)
                                    Text(if (isAr) "لكل هدف مساحته الخاصة" else "Every Goal Has Its Own Space", fontSize = 10.sp, color = Color.Gray)
                                }
                            }
                        },
                        navigationIcon = { if (screen != "home") IconButton(onClick = { screen = "home" }) { Icon(Icons.Default.ArrowBack, null) } },
                        actions = {
                            IconButton(onClick = { screen = "search" }) { Icon(Icons.Default.Search, null) }
                            IconButton(onClick = { screen = "completed" }) { Icon(Icons.Default.EmojiEvents, null) }
                            IconButton(onClick = { screen = "archived" }) { Icon(Icons.Default.Inventory, null) }
                            IconButton(onClick = { screen = "settings" }) { Icon(Icons.Default.Settings, null) }
                        }
                    )
                },
                floatingActionButton = {
                    if (screen == "home") ExtendedFloatingActionButton(containerColor = Color(0xFF1B2A4A), contentColor = Color.White, onClick = { editGoal = null; screen = "form" }, icon = { Icon(Icons.Default.Add, null) }, text = { Text(if (isAr) "إضافة درج هدف" else "Add Goal Drawer", fontWeight = FontWeight.Bold) })
                    else if (screen == "notebook" && curGoal != null) ExtendedFloatingActionButton(containerColor = Color(0xFF1B2A4A), contentColor = Color.White, onClick = {
                        scope.launch {
                            val np = NotebookPageEntity(goalId = curGoal.id, title = if (isAr) "صفحة ${goalPages.size + 1}" else "Page ${goalPages.size + 1}", content = Codec.encode(listOf(PageBlock())), pageOrder = goalPages.size)
                            dao.savePage(np); pageId = np.id; screen = "editor"
                        }
                    }, icon = { Icon(Icons.Default.NoteAdd, null) }, text = { Text(if (isAr) "صفحة حرة جديدة" else "New Page", fontWeight = FontWeight.Bold) })
                }
            ) { pad ->
                Box(Modifier.padding(pad).fillMaxSize()) {
                    when (screen) {
                        "home" -> CabinetHome(active, completed.size, archived.size, allPages, isAr, isDark,
                            onOpen = { goalId = it.id; screen = "notebook" }, onEdit = { editGoal = it; screen = "form" },
                            onStatus = { g, st -> scope.launch { dao.saveGoal(g.copy(status = st, updatedAt = System.currentTimeMillis())) } },
                            onDelete = { delGoal = it }, onCompleted = { screen = "completed" }, onArchived = { screen = "archived" })
                        "form" -> GoalForm(editGoal, isAr, { screen = "home" }) { t, d, ic, col ->
                            scope.launch {
                                val g = editGoal?.copy(title = t, description = d, icon = ic, color = col, updatedAt = System.currentTimeMillis()) ?: GoalEntity(title = t, description = d, icon = ic, color = col)
                                dao.saveGoal(g)
                                if (editGoal == null) dao.savePage(NotebookPageEntity(goalId = g.id, title = if (isAr) "الصفحة الأولى" else "First Page", content = Codec.encode(listOf(PageBlock(type = "HEADING_1", text = t), PageBlock())), plainText = t))
                                screen = "home"
                            }
                        }
                        "notebook" -> curGoal?.let { g ->
                            NotebookView(g, goalPages, isAr, { pageId = it.id; screen = "editor" }, { editGoal = g; screen = "form" },
                                { st -> scope.launch { dao.saveGoal(g.copy(status = st)); screen = "home" } },
                                { p -> scope.launch { dao.savePage(p.copy(id = UUID.randomUUID().toString(), title = "${p.title} (2)", pageOrder = goalPages.size)) } },
                                { delPage = it })
                        }
                        "editor" -> if (curGoal != null && curPage != null) PageEditor(curGoal, curPage, goalPages, isAr, ruled,
                            onSave = { t, blks -> scope.launch { dao.savePage(curPage.copy(title = t, content = Codec.encode(blks), plainText = Codec.plain(blks), updatedAt = System.currentTimeMillis())) } },
                            onSwitch = { pageId = it.id }, onBack = { screen = "notebook" })
                        "search" -> SearchView(query, { query = it }, goals, allPages, isAr, { goalId = it.id; screen = "notebook" }, { goalId = it.goalId; pageId = it.id; screen = "editor" })
                        "completed" -> StatusView(if (isAr) "خزانة الأهداف المكتملة" else "Completed Cabinet", completed, allPages, isAr, { goalId = it.id; screen = "notebook" }, { scope.launch { dao.saveGoal(it.copy(status = "ACTIVE")) } }, { delGoal = it })
                        "archived" -> StatusView(if (isAr) "خزانة الأهداف المؤرشفة" else "Archived Cabinet", archived, allPages, isAr, { goalId = it.id; screen = "notebook" }, { scope.launch { dao.saveGoal(it.copy(status = "ACTIVE")) } }, { delGoal = it })
                        "settings" -> SettingsView(isAr, isDark, ruled, goals.size, allPages.size, onLang, onTheme, onRuled, { exporter.launch("my_goal_backup.json") }, { importer.launch(arrayOf("application/json", "*/*")) })
                    }
                }
            }
        }

        @Composable
        fun CabinetHome(active: List<GoalEntity>, comp: Int, arch: Int, pages: List<NotebookPageEntity>, isAr: Boolean, isDark: Boolean, onOpen: (GoalEntity) -> Unit, onEdit: (GoalEntity) -> Unit, onStatus: (GoalEntity, String) -> Unit, onDelete: (GoalEntity) -> Unit, onCompleted: () -> Unit, onArchived: () -> Unit) {
            val woodOuter = if (isDark) Color(0xFF1F273B) else Color(0xFFDED6C8)
            val woodFrame = if (isDark) Color(0xFF2B3550) else Color(0xFFCBBFA9)
            val recess = if (isDark) Color(0xFF0B0F19) else Color(0xFFB3A690)
            val crown = if (isDark) Color(0xFF28334A) else Color(0xFF2B3A55)

            LazyColumn(Modifier.fillMaxSize().padding(horizontal = 14.dp)) {
                item {
                    Spacer(Modifier.height(8.dp))
                    Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        StatBadge(if (isAr) "النشطة" else "Active", active.size, Color(0xFF1B2A4A), Modifier.weight(1f)) {}
                        StatBadge(if (isAr) "المكتملة" else "Completed", comp, Color(0xFF2E7D32), Modifier.weight(1f), onCompleted)
                        StatBadge(if (isAr) "الأرشيف" else "Archived", arch, Color(0xFF6A4C93), Modifier.weight(1f), onArchived)
                    }
                    Spacer(Modifier.height(14.dp))
                    // 3D Cabinet Crown Molding + Brass Nameplate
                    Box(Modifier.fillMaxWidth().padding(horizontal = 4.dp).height(9.dp).clip(RoundedCornerShape(topStart = 12.dp, topEnd = 12.dp)).background(Brush.verticalGradient(listOf(Color(0xFF425475), crown))))
                    Box(Modifier.fillMaxWidth().background(Brush.verticalGradient(listOf(crown, Color(0xFF192438))), RoundedCornerShape(topStart = 8.dp, topEnd = 8.dp)).border(2.dp, Color(0xFF9C8B70), RoundedCornerShape(topStart = 8.dp, topEnd = 8.dp)).padding(12.dp), contentAlignment = Alignment.Center) {
                        Surface(shape = RoundedCornerShape(8.dp), color = Color(0xFFD9B872), border = BorderStroke(1.5.dp, Color(0xFF7D622A)), shadowElevation = 4.dp) {
                            Row(Modifier.padding(horizontal = 14.dp, vertical = 4.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Rivet(); Text(if (isAr) "خزانة الأهداف الخاصة • MY GOAL" else "PERSONAL GOAL CABINET • MY GOAL", fontWeight = FontWeight.Black, fontSize = 11.sp, color = Color(0xFF231B0C)); Rivet()
                            }
                        }
                    }
                    // Cabinet Wood Body & Recessed Slots
                    Box(Modifier.fillMaxWidth().background(woodOuter).border(3.dp, woodFrame).padding(12.dp)) {
                        Column(Modifier.fillMaxWidth().clip(RoundedCornerShape(12.dp)).background(recess).border(2.dp, Color.Black.copy(alpha = 0.25f), RoundedCornerShape(12.dp)).padding(10.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                            if (active.isEmpty()) {
                                Column(Modifier.fillMaxWidth().padding(28.dp), horizontalAlignment = Alignment.CenterHorizontally) {
