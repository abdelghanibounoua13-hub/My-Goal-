          enum class GoalStatus { ACTIVE, COMPLETED, ARCHIVED }

          @Entity(tableName = "goals")
          data class GoalEntity(
              @PrimaryKey val id: String = UUID.randomUUID().toString(),
              val title: String,
              val description: String = "",
              val icon: String = "Star",
              val color: Long = 0xFFE6EEF8,
              val status: String = GoalStatus.ACTIVE.name,
              val createdAt: Long = System.currentTimeMillis(),
              val updatedAt: Long = System.currentTimeMillis()
          )

          @Entity(
              tableName = "notebook_pages",
              foreignKeys = [
                  ForeignKey(
                      entity = GoalEntity::class,
                      parentColumns = ["id"],
                      childColumns = ["goalId"],
                      onDelete = ForeignKey.CASCADE
                  )
              ],
              indices = [Index(value = ["goalId"])]
          )
          data class NotebookPageEntity(
              @PrimaryKey val id: String = UUID.randomUUID().toString(),
              val goalId: String,
              val title: String,
              val content: String,
              val plainText: String,
              val pageOrder: Int,
              val createdAt: Long = System.currentTimeMillis(),
              val updatedAt: Long = System.currentTimeMillis()
          )

          data class SearchResultItem(
              val goalId: String,
              val goalTitle: String,
              val goalColor: Long,
              val goalIcon: String,
              val pageId: String?,
              val pageTitle: String?,
              val snippet: String
          )

          @Dao
          interface MyGoalDao {
              @Query("SELECT * FROM goals ORDER BY createdAt DESC")
              fun observeAllGoals(): Flow<List<GoalEntity>>

              @Query("SELECT * FROM goals WHERE id = :goalId LIMIT 1")
              fun observeGoalById(goalId: String): Flow<GoalEntity?>

              @Query("SELECT * FROM goals WHERE id = :goalId LIMIT 1")
              suspend fun getGoalById(goalId: String): GoalEntity?

              @Query("SELECT * FROM goals")
              suspend fun getAllGoalsSnapshot(): List<GoalEntity>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertGoal(goal: GoalEntity)

              @Delete
              suspend fun deleteGoal(goal: GoalEntity)

              @Query("SELECT * FROM notebook_pages WHERE goalId = :goalId ORDER BY pageOrder ASC, createdAt ASC")
              fun observePagesForGoal(goalId: String): Flow<List<NotebookPageEntity>>

              @Query("SELECT * FROM notebook_pages WHERE goalId = :goalId ORDER BY pageOrder ASC, createdAt ASC")
              suspend fun getPagesForGoalSnapshot(goalId: String): List<NotebookPageEntity>

              @Query("SELECT * FROM notebook_pages WHERE id = :pageId LIMIT 1")
              suspend fun getPageById(pageId: String): NotebookPageEntity?

              @Query("SELECT * FROM notebook_pages")
              fun observeAllPages(): Flow<List<NotebookPageEntity>>

              @Query("SELECT * FROM notebook_pages")
              suspend fun getAllPagesSnapshot(): List<NotebookPageEntity>

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertPage(page: NotebookPageEntity)

              @Insert(onConflict = OnConflictStrategy.REPLACE)
              suspend fun upsertPages(pages: List<NotebookPageEntity>)

              @Query("DELETE FROM notebook_pages WHERE id = :pageId")
              suspend fun deletePageById(pageId: String)

              @Query("DELETE FROM notebook_pages")
              suspend fun deleteAllPages()

              @Query("DELETE FROM goals")
              suspend fun deleteAllGoals()

              @Transaction
              suspend fun replaceAllData(goals: List<GoalEntity>, pages: List<NotebookPageEntity>) {
                  deleteAllPages()
                  deleteAllGoals()
                  goals.forEach { upsertGoal(it) }
                  upsertPages(pages)
              }
          }

          @Database(entities = [GoalEntity::class, NotebookPageEntity::class], version = 1, exportSchema = false)
          abstract class MyGoalDatabase : RoomDatabase() {
              abstract fun dao(): MyGoalDao

              companion object {
                  @Volatile
                  private var INSTANCE: MyGoalDatabase? = null

                  fun getInstance(context: Context): MyGoalDatabase {
                      return INSTANCE ?: synchronized(this) {
                          Room.databaseBuilder(
                              context.applicationContext,
                              MyGoalDatabase::class.java,
                              "my_goal_cabinet.db"
                          ).fallbackToDestructiveMigration().build().also { INSTANCE = it }
                      }
                  }
              }
          }

