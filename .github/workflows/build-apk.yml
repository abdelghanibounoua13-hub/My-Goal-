              }

              suspend fun setDarkTheme(isDark: Boolean) {
                  context.dataStore.edit { it[KEY_DARK_THEME] = isDark }
              }
          }

          object BackupSerializer {
              fun exportToJson(context: Context, goals: List<GoalEntity>, pages: List<NotebookPageEntity>): String {
                  val root = JSONObject()
                  root.put("app", "MyGoal")
                  root.put("version", 1)
                  root.put("exportedAt", System.currentTimeMillis())

                  val goalsArray = JSONArray()
                  goals.forEach { g ->
                      goalsArray.put(JSONObject().apply {
                          put("id", g.id)
                          put("title", g.title)
                          put("description", g.description)
                          put("icon", g.icon)
                          put("color", g.color)
                          put("status", g.status)
                          put("createdAt", g.createdAt)
                          put("updatedAt", g.updatedAt)
                      })
                  }
                  root.put("goals", goalsArray)

                  val pagesArray = JSONArray()
                  pages.forEach { p ->
                      pagesArray.put(JSONObject().apply {
                          put("id", p.id)
                          put("goalId", p.goalId)
                          put("title", p.title)
                          put("content", p.content)
                          put("plainText", p.plainText)
                          put("pageOrder", p.pageOrder)
                          put("createdAt", p.createdAt)
                          put("updatedAt", p.updatedAt)
                      })
                  }
                  root.put("pages", pagesArray)

                  val imagesObject = JSONObject()
                  val imageDir = File(context.filesDir, "notebook_images")
                  if (imageDir.exists() && imageDir.isDirectory) {
                      imageDir.listFiles()?.forEach { file ->
                          if (file.isFile && file.length() < 8 * 1024 * 1024) {
                              imagesObject.put(file.name, Base64.encodeToString(file.readBytes(), Base64.NO_WRAP))
                          }
                      }
                  }
                  root.put("images", imagesObject)
                  return root.toString(2)
              }

              fun importFromJson(context: Context, jsonString: String): Pair<List<GoalEntity>, List<NotebookPageEntity>> {
                  val root = JSONObject(jsonString)
                  val goalsArray = root.optJSONArray("goals") ?: JSONArray()
                  val pagesArray = root.optJSONArray("pages") ?: JSONArray()
                  val imagesObject = root.optJSONObject("images")

                  val goals = mutableListOf<GoalEntity>()
                  for (i in 0 until goalsArray.length()) {
                      val g = goalsArray.getJSONObject(i)
                      goals.add(
                          GoalEntity(
                              id = g.getString("id"),
                              title = g.getString("title"),
                              description = g.optString("description", ""),
                              icon = g.optString("icon", "Star"),
                              color = g.optLong("color", 0xFFE6EEF8),
                              status = g.optString("status", GoalStatus.ACTIVE.name),
                              createdAt = g.optLong("createdAt", System.currentTimeMillis()),
                              updatedAt = g.optLong("updatedAt", System.currentTimeMillis())
                          )
                      )
                  }

                  val imageDir = File(context.filesDir, "notebook_images")
                  if (!imageDir.exists()) imageDir.mkdirs()
                  if (imagesObject != null) {
                      val keys = imagesObject.keys()
                      while (keys.hasNext()) {
                          val fileName = keys.next()
                          val b64 = imagesObject.optString(fileName, "")
                          if (b64.isNotBlank()) {
                              runCatching {
                                  File(imageDir, fileName).writeBytes(Base64.decode(b64, Base64.NO_WRAP))
                              }
                          }
                      }
                  }

                  val pages = mutableListOf<NotebookPageEntity>()
                  for (i in 0 until pagesArray.length()) {
                      val p = pagesArray.getJSONObject(i)
                      pages.add(
                          NotebookPageEntity(
                              id = p.getString("id"),
                              goalId = p.getString("goalId"),
                              title = p.getString("title"),
                              content = p.getString("content"),
                              plainText = p.optString("plainText", ""),
                              pageOrder = p.optInt("pageOrder", i),
                              createdAt = p.optLong("createdAt", System.currentTimeMillis()),
                              updatedAt = p.optLong("updatedAt", System.currentTimeMillis())
                          )
                      )
                  }
                  return goals to pages
              }
          }

