                        AssistChip(onClick = { onStatus("COMPLETED") }, leadingIcon = { Icon(Icons.Default.CheckCircle, null, Modifier.size(16.dp)) }, label = { Text(if (isAr) "مكتمل" else "Complete") })
                        AssistChip(onClick = { onStatus("ARCHIVED") }, leadingIcon = { Icon(Icons.Default.Inventory, null, Modifier.size(16.dp)) }, label = { Text(if (isAr) "أرشفة" else "Archive") })
                    }
                    OutlinedTextField(q, { q = it }, leadingIcon = { Icon(Icons.Default.Search, null) }, placeholder = { Text(if (isAr) "ابحث داخل صفحات هذا الدفتر..." else "Search pages...") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                }
                itemsIndexed(pages.filter { q.isBlank() || it.title.contains(q, true) || it.plainText.contains(q, true) }) { i, p ->
                    Surface(Modifier.fillMaxWidth().clickable { onOpen(p) }, shape = RoundedCornerShape(14.dp), color = MaterialTheme.colorScheme.surface, border = BorderStroke(1.dp, Color(0xFFD8D0C5))) {
                        Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                            Surface(shape = RoundedCornerShape(8.dp), color = Color(goal.color), modifier = Modifier.size(38.dp)) { Box(contentAlignment = Alignment.Center) { Text("${i + 1}", fontWeight = FontWeight.Black, color = Color(0xFF1B2A4A)) } }
                            Column(Modifier.weight(1f)) {
                                Text(p.title, fontWeight = FontWeight.ExtraBold, fontSize = 16.sp)
                                if (p.plainText.isNotBlank()) Text(p.plainText, maxLines = 2, overflow = TextOverflow.Ellipsis, fontSize = 12.sp, color = Color.Gray)
                            }
                            IconButton({ onDup(p) }) { Icon(Icons.Default.ContentCopy, null) }
                            IconButton({ onDel(p) }) { Icon(Icons.Default.Delete, null, tint = Color(0xFFC62828)) }
                        }
                    }
                }
                item { Spacer(Modifier.height(80.dp)) }
            }
        }

        @Composable
        fun PageEditor(goal: GoalEntity, page: NotebookPageEntity, allPages: List<NotebookPageEntity>, isAr: Boolean, defRuled: Boolean, onSave: (String, List<PageBlock>) -> Unit, onSwitch: (NotebookPageEntity) -> Unit, onBack: () -> Unit) {
            val ctx = LocalContext.current; val uriHandler = LocalUriHandler.current
            var title by remember(page.id) { mutableStateOf(page.title) }
            val blocks = remember(page.id) { mutableStateListOf<PageBlock>().apply { addAll(Codec.decode(page.content)) } }
            var activeIdx by remember(page.id) { mutableStateOf(0) }
            var focus by remember { mutableStateOf(false) }
            var ruled by remember { mutableStateOf(defRuled) }
            var switcher by remember { mutableStateOf(false) }
            val undo = remember(page.id) { mutableStateListOf<String>() }
            val rich = remember { RichTransform() }

            fun snap() { val s = Codec.encode(blocks.toList()); if (undo.lastOrNull() != s) undo.add(s) }

            val imgPick = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { u ->
                u?.let {
                    runCatching {
                        val f = File(File(ctx.filesDir, "notebook_images").apply { mkdirs() }, "img_${System.currentTimeMillis()}.jpg")
                        ctx.contentResolver.openInputStream(it)?.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                        snap(); blocks.add(PageBlock(type = "IMAGE", extra = f.absolutePath))
                    }
                }
            }

            LaunchedEffect(title, blocks.toList()) { delay(350); onSave(title, blocks.toList()) }

            Column(Modifier.fillMaxSize()) {
                Surface(color = Color(goal.color), shadowElevation = 3.dp) {
                    Row(Modifier.fillMaxWidth().padding(6.dp), verticalAlignment = Alignment.CenterVertically) {
                        IconButton({ onSave(title, blocks.toList()); onBack() }) { Icon(Icons.Default.ArrowBack, null, tint = Color(0xFF1B2A4A)) }
                        Column(Modifier.weight(1f)) {
                            Text(goal.title, fontWeight = FontWeight.Black, fontSize = 14.sp, color = Color(0xFF1B2A4A), maxLines = 1)
                            Text(if (isAr) "حفظ تلقائي ✓" else "Auto-saved ✓", fontSize = 10.sp, color = Color(0xFF2D3E5E))
                        }
                        TextButton({ switcher = !switcher }) { Text("${allPages.size} 📄", color = Color(0xFF1B2A4A), fontWeight = FontWeight.Bold) }
                        IconButton({ if (undo.isNotEmpty()) { val prev = Codec.decode(undo.removeAt(undo.lastIndex)); blocks.clear(); blocks.addAll(prev) } }) { Icon(Icons.Default.Undo, null, tint = Color(0xFF1B2A4A)) }
                        IconButton({ ruled = !ruled }) { Icon(Icons.Default.FormatAlignJustify, null, tint = Color(0xFF1B2A4A)) }
                        IconButton({ focus = !focus }) { Icon(Icons.Default.Visibility, null, tint = Color(0xFF1B2A4A)) }
                    }
                }
                AnimatedVisibility(switcher) {
                    LazyRow(Modifier.padding(8.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                        items(allPages) { p -> FilterChip(p.id == page.id, { onSave(title, blocks.toList()); onSwitch(p) }, { Text(p.title) }) }
                    }
                }
                AnimatedVisibility(!focus) {
                    Surface(color = MaterialTheme.colorScheme.surface) {
                        Column(Modifier.padding(vertical = 4.dp)) {
                            LazyRow(contentPadding = PaddingValues(horizontal = 10.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "HEADING_1")) }, { Text("H1", fontWeight = FontWeight.Bold) }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "HEADING_2")) }, { Text("H2", fontWeight = FontWeight.Bold) }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "PARAGRAPH")) }, { Text(if (isAr) "+ نص" else "+ Text") }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "CHECKLIST")) }, { Text(if (isAr) "☑ مهمة" else "☑ Task") }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "BULLET")) }, { Text(if (isAr) "• نقاط" else "• List") }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "QUOTE")) }, { Text(if (isAr) "❝ اقتباس" else "❝ Quote") }) }
                                item { AssistChip({ snap(); blocks.add(PageBlock(type = "TABLE", extra = Codec.encodeTable(listOf(listOf("البند", "التفاصيل"), listOf("", ""))))) }, { Text(if (isAr) "⊞ جدول" else "⊞ Table") }) }
                                item { AssistChip({ imgPick.launch("image/*") }, { Text(if (isAr) "🖼️ صورة" else "🖼️ Image") }) }
                            }
                            LazyRow(contentPadding = PaddingValues(horizontal = 10.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                fun mark(m: String, w: String) { val i = activeIdx.coerceIn(0, (blocks.size - 1).coerceAtLeast(0)); if (blocks.isNotEmpty()) { snap(); blocks[i] = blocks[i].copy(text = blocks[i].text + " $m$w$m ") } }
                                item { AssistChip({ mark("**", if (isAr) "عريض" else "bold") }, { Text("B", fontWeight = FontWeight.Black) }) }
                                item { AssistChip({ mark("*", if (isAr) "مائل" else "italic") }, { Text("I", fontStyle = FontStyle.Italic) }) }
                                item { AssistChip({ mark("__", if (isAr) "خط" else "underline") }, { Text("U", textDecoration = TextDecoration.Underline) }) }
                                item { AssistChip({ mark("==", if (isAr) "مظلل" else "highlight") }, { Text(if (isAr) "تظليل" else "Highlight") }) }
                                item { AssistChip({ val i = activeIdx.coerceIn(0, (blocks.size - 1).coerceAtLeast(0)); if (blocks.isNotEmpty()) { snap(); blocks[i] = blocks[i].copy(text = blocks[i].text + " [رابط](https://google.com) ") } }, { Text("🔗") }) }
                            }
                        }
                    }
                }
                Box(Modifier.fillMaxWidth().weight(1f).drawBehind {
                    if (ruled) { val st = 34.dp.toPx(); var y = st * 2f; while (y < size.height) { drawLine(Color(0xFF90A4AE).copy(alpha = 0.22f), Offset(0f, y), Offset(size.width, y), 1.dp.toPx()); y += st } }
                }) {
                    LazyColumn(Modifier.fillMaxSize().padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                        item { OutlinedTextField(title, { title = it }, textStyle = LocalTextStyle.current.copy(fontWeight = FontWeight.Black, fontSize = 21.sp), modifier = Modifier.fillMaxWidth()) }
                        itemsIndexed(blocks, key = { _, b -> b.id }) { idx, b ->
                            val links = remember(b.text) { Regex("\\[(.+?)]\\((.+?)\\)").findAll(b.text).map { it.groupValues[1] to it.groupValues[2] }.toList() }
                            Column {
                                when (b.type) {
                                    "HEADING_1", "HEADING_2" -> Row(verticalAlignment = Alignment.CenterVertically) {
                                        OutlinedTextField(b.text, { activeIdx = idx; blocks[idx] = b.copy(text = it) }, textStyle = LocalTextStyle.current.copy(fontWeight = FontWeight.Black, fontSize = if (b.type == "HEADING_1") 20.sp else 17.sp), modifier = Modifier.weight(1f))
                                        if (blocks.size > 1) IconButton({ snap(); blocks.removeAt(idx) }) { Icon(Icons.Default.Close, null) }
                                    }
                                    "CHECKLIST" -> Row(verticalAlignment = Alignment.CenterVertically) {
                                        Checkbox(b.checked, { snap(); blocks[idx] = b.copy(checked = it) })
                                        OutlinedTextField(b.text, { activeIdx = idx; blocks[idx] = b.copy(text = it) }, visualTransformation = rich, modifier = Modifier.weight(1f))
                                        IconButton({ snap(); blocks.removeAt(idx) }) { Icon(Icons.Default.Close, null) }
                                    }
                                    "BULLET", "QUOTE" -> Row(verticalAlignment = Alignment.CenterVertically) {
                                        Text(if (b.type == "BULLET") "● " else "❝ ", fontWeight = FontWeight.Black, fontSize = 18.sp)
                                        OutlinedTextField(b.text, { activeIdx = idx; blocks[idx] = b.copy(text = it) }, visualTransformation = rich, modifier = Modifier.weight(1f))
                                        IconButton({ snap(); blocks.removeAt(idx) }) { Icon(Icons.Default.Close, null) }
                                    }
                                    "IMAGE" -> {
                                        val bmp = remember(b.extra) { runCatching { BitmapFactory.decodeFile(b.extra)?.asImageBitmap() }.getOrNull() }
                                        Column {
                                            if (bmp != null) Image(bmp, null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxWidth().height(200.dp).clip(RoundedCornerShape(12.dp)))
                                            IconButton({ snap(); blocks.removeAt(idx) }) { Icon(Icons.Default.Delete, null, tint = Color(0xFFC62828)) }
                                        }
                                    }
                                    "TABLE" -> {
                                        val grid = remember(b.extra) { Codec.decodeTable(b.extra) }
                                        Surface(shape = RoundedCornerShape(12.dp), color = MaterialTheme.colorScheme.surface, modifier = Modifier.fillMaxWidth()) {
                                            Column(Modifier.padding(8.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                                                Row {
                                                    TextButton({ snap(); val cols = grid.firstOrNull()?.size ?: 2; blocks[idx] = b.copy(extra = Codec.encodeTable(grid + listOf(List(cols) { "" }))) }) { Text("+ Row") }
                                                    TextButton({ snap(); blocks[idx] = b.copy(extra = Codec.encodeTable(grid.map { it + "" })) }) { Text("+ Col") }
                                                    IconButton({ snap(); blocks.removeAt(idx) }) { Icon(Icons.Default.Delete, null, tint = Color(0xFFC62828)) }
                                                }
                                                grid.forEachIndexed { r, row ->
                                                    Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                                                        row.forEachIndexed { c, cell ->
                                                            OutlinedTextField(cell, { v -> val mg = grid.map { it.toMutableList() }.toMutableList(); mg[r][c] = v; blocks[idx] = b.copy(extra = Codec.encodeTable(mg)) }, modifier = Modifier.weight(1f))
                                                        }
                                                    }
                                                }
                                            }
                                        }
                                    }
                                    else -> OutlinedTextField(b.text, { activeIdx = idx; blocks[idx] = b.copy(text = it) }, placeholder = { Text(if (isAr) "مساحة كتابة حرة تماماً..." else "100% Free-form space...") }, visualTransformation = rich, modifier = Modifier.fillMaxWidth().heightIn(min = 110.dp))
                                }
                                if (links.isNotEmpty()) LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                    items(links) { (l, u) -> AssistChip({ runCatching { uriHandler.openUri(u) } }, { Text("🔗 $l") }) }
                                }
                            }
                        }
                        item { Spacer(Modifier.height(90.dp)) }
                    }
                }
            }
        }

        @Composable
        fun SearchView(q: String, onQ: (String) -> Unit, goals: List<GoalEntity>, pages: List<NotebookPageEntity>, isAr: Boolean, onGoal: (GoalEntity) -> Unit, onPage: (NotebookPageEntity) -> Unit) {
            Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                OutlinedTextField(q, onQ, leadingIcon = { Icon(Icons.Default.Search, null) }, placeholder = { Text(if (isAr) "بحث شامل في كل الخزانة والدفاتر..." else "Global search...") }, modifier = Modifier.fillMaxWidth())
                LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    items(goals.filter { q.isNotBlank() && (it.title.contains(q, true) || it.description.contains(q, true)) }) { g -> TactileDrawer(g, 1, 1, isAr, false, { onGoal(g) }) }
                    items(pages.filter { q.isNotBlank() && (it.title.contains(q, true) || it.plainText.contains(q, true)) }) { p ->
                        Card(Modifier.fillMaxWidth().clickable { onPage(p) }) { Column(Modifier.padding(12.dp)) { Text("📄 ${p.title}", fontWeight = FontWeight.Bold); Text(p.plainText, maxLines = 2, fontSize = 12.sp) } }
                    }
                }
            }
        }

        @Composable
        fun StatusView(title: String, list: List<GoalEntity>, pages: List<NotebookPageEntity>, isAr: Boolean, onOpen: (GoalEntity) -> Unit, onRestore: (GoalEntity) -> Unit, onDel: (GoalEntity) -> Unit) {
            LazyColumn(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                item { Text(title, fontWeight = FontWeight.Black, fontSize = 20.sp) }
                itemsIndexed(list) { i, g ->
                    TactileDrawer(g, i + 1, pages.count { it.goalId == g.id }, isAr, false, { onOpen(g) }, onComplete = { onRestore(g) }, onDelete = { onDel(g) })
                    Button({ onRestore(g) }, Modifier.fillMaxWidth()) { Text(if (isAr) "إعادة إلى الخزانة النشطة" else "Restore to Active Cabinet") }
                }
            }
        }

        @Composable
        fun SettingsView(isAr: Boolean, isDark: Boolean, ruled: Boolean, gCount: Int, pCount: Int, onLang: (Boolean) -> Unit, onTheme: (Boolean) -> Unit, onRuled: (Boolean) -> Unit, onExport: () -> Unit, onImport: () -> Unit) {
            Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                Text(if (isAr) "الإعدادات والنسخ الاحتياطي" else "Settings & Backup", fontWeight = FontWeight.Black, fontSize = 20.sp)
                Row(verticalAlignment = Alignment.CenterVertically) { Text(if (isAr) "اللغة العربية (RTL)" else "Arabic (RTL)", Modifier.weight(1f)); Switch(isAr, onLang) }
                Row(verticalAlignment = Alignment.CenterVertically) { Text(if (isAr) "الوضع الليلي الداكن" else "Dark Mode", Modifier.weight(1f)); Switch(isDark, onTheme) }
                Row(verticalAlignment = Alignment.CenterVertically) { Text(if (isAr) "تسطير أوراق الدفتر" else "Ruled Notebook Lines", Modifier.weight(1f)); Switch(ruled, onRuled) }
                HorizontalDivider()
                Text(if (isAr) "إحصائيات الخزانة: $gCount أدراج • $pCount صفحات" else "Cabinet: $gCount drawers • $pCount pages", fontWeight = FontWeight.Bold)
                Button(onExport, Modifier.fillMaxWidth()) { Text(if (isAr) "تصدير نسخة احتياطية شاملة (JSON)" else "Export Full Backup (JSON)") }
                OutlinedButton(onImport, Modifier.fillMaxWidth()) { Text(if (isAr) "استعادة نسخة احتياطية" else "Restore Backup") }
            }
        }
