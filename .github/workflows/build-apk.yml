        @Composable
        fun GoalForm(edit: GoalEntity?, isAr: Boolean, onCancel: () -> Unit, onSave: (String, String, String, Long) -> Unit) {
            var title by remember { mutableStateOf(edit?.title ?: "") }
            var desc by remember { mutableStateOf(edit?.description ?: "") }
            var icon by remember { mutableStateOf(edit?.icon ?: "Star") }
            var color by remember { mutableStateOf(edit?.color ?: drawerPalette.first().first) }

            Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                Text(if (edit == null) (if (isAr) "تصميم درج هدف جديد" else "Craft New Goal Drawer") else (if (isAr) "تعديل تصميم الدرج" else "Edit Drawer"), fontWeight = FontWeight.Black, fontSize = 20.sp)
                Text(if (isAr) "معاينة حية لشكل الدرج ثلاثي الأبعاد:" else "Live 3D Drawer Preview:", fontWeight = FontWeight.Bold, fontSize = 12.sp)
                TactileDrawer(GoalEntity(title = title, description = desc, icon = icon, color = color), 1, 1, isAr, true)
                OutlinedTextField(title, { title = it }, label = { Text(if (isAr) "اسم الهدف (مطلوب)" else "Goal Name") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                OutlinedTextField(desc, { desc = it }, label = { Text(if (isAr) "وصف قصير (اختياري)" else "Description") }, modifier = Modifier.fillMaxWidth())
                Text(if (isAr) "لون طلاء الدرج:" else "Drawer Color:", fontWeight = FontWeight.Bold)
                LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    items(drawerPalette) { (hex, ar, en) ->
                        Column(horizontalAlignment = Alignment.CenterHorizontally, modifier = Modifier.clickable { color = hex }) {
                            Box(Modifier.size(44.dp).clip(RoundedCornerShape(12.dp)).background(Color(hex)).border(if (color == hex) 3.dp else 1.dp, Color(0xFF1B2A4A), RoundedCornerShape(12.dp)), contentAlignment = Alignment.Center) {
                                if (color == hex) Icon(Icons.Default.Check, null, tint = Color(0xFF1B2A4A))
                            }
                            Text(if (isAr) ar else en, fontSize = 10.sp)
                        }
                    }
                }
                Text(if (isAr) "أيقونة الدرج:" else "Drawer Icon:", fontWeight = FontWeight.Bold)
                LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    items(drawerIcons.keys.toList()) { k ->
                        Surface(shape = RoundedCornerShape(12.dp), color = if (icon == k) Color(0xFF1B2A4A) else MaterialTheme.colorScheme.surface, modifier = Modifier.size(48.dp).clickable { icon = k }) {
                            Box(contentAlignment = Alignment.Center) { Icon(drawerIcons[k]!!, null, tint = if (icon == k) Color(0xFFFFDF8E) else MaterialTheme.colorScheme.onSurface) }
                        }
                    }
                }
                Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                    OutlinedButton(onCancel, Modifier.weight(1f)) { Text(if (isAr) "إلغاء" else "Cancel") }
                    Button({ if (title.isNotBlank()) onSave(title.trim(), desc.trim(), icon, color) }, enabled = title.isNotBlank(), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1B2A4A)), modifier = Modifier.weight(1f)) { Text(if (isAr) "حفظ وتركيب الدرج" else "Save Drawer", color = Color.White) }
                }
            }
        }

        @Composable
        fun NotebookView(goal: GoalEntity, pages: List<NotebookPageEntity>, isAr: Boolean, onOpen: (NotebookPageEntity) -> Unit, onEdit: () -> Unit, onStatus: (String) -> Unit, onDup: (NotebookPageEntity) -> Unit, onDel: (NotebookPageEntity) -> Unit) {
