name: Build My Goal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate Android Project
      run: |
        mkdir -p app/src/main/java/com/mygoal/app

        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "MyGoal"
        include(":app")
        EOF

        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.3.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.23" apply false
            id("com.google.devtools.ksp") version "1.9.23-1.0.20" apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
            id("com.google.devtools.ksp")
        }
        android {
            namespace = "com.mygoal.app"
            compileSdk = 34
            defaultConfig {
                applicationId = "com.mygoal.app"
                minSdk = 26
                targetSdk = 34
                versionCode = 1
                versionName = "1.0.0"
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = "17" }
        }
        dependencies {
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
            implementation("androidx.activity:activity-compose:1.8.2")
            implementation(platform("androidx.compose:compose-bom:2024.04.01"))
            implementation("androidx.compose.ui:ui")
            implementation("androidx.compose.ui:ui-graphics")
            implementation("androidx.compose.material3:material3")
            implementation("androidx.compose.material:material-icons-extended")
            implementation("androidx.room:room-runtime:2.6.1")
            implementation("androidx.room:room-ktx:2.6.1")
            ksp("androidx.room:room-compiler:2.6.1")
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="MY GOAL"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/java/com/mygoal/app/MainActivity.kt
        package com.mygoal.app

        import android.content.Context
        import android.net.Uri
        import android.os.Bundle
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.rememberLauncherForActivityResult
        import androidx.activity.compose.setContent
        import androidx.activity.result.contract.ActivityResultContracts
        import androidx.compose.animation.AnimatedVisibility
        import androidx.compose.foundation.*
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.LazyRow
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material.icons.Icons
        import androidx.compose.material.icons.filled.*
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.draw.clip
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.graphics.vector.ImageVector
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.platform.LocalLayoutDirection
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.LayoutDirection
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.room.*
        import kotlinx.coroutines.delay
        import kotlinx.coroutines.flow.Flow
        import kotlinx.coroutines.launch
        import org.json.JSONArray
        import org.json.JSONObject
        import java.text.SimpleDateFormat
        import java.util.*

        @Entity(tableName = "goals")
        data class GoalEntity(
            @PrimaryKey val id: String = UUID.randomUUID().toString(),
            val title: String,
            val description: String = "",
            val icon: String = "Star",
            val color: Long = 0xFFE6EEF8,
            val status: String = "ACTIVE",
            val createdAt: Long = System.currentTimeMillis(),
            val updatedAt: Long = System.currentTimeMillis()
        )

        @Entity(
            tableName = "notebook_pages",
            foreignKeys = [ForeignKey(entity = GoalEntity::class, parentColumns = ["id"], childColumns = ["goalId"], onDelete = ForeignKey.CASCADE)],
            indices = [Index("goalId")]
        )
        data class NotebookPageEntity(
            @PrimaryKey val id: String = UUID.randomUUID().toString(),
            val goalId: String,
            val title: String,
            val content: String = "",
            val pageOrder: Int = 0,
            val createdAt: Long = System.currentTimeMillis(),
            val updatedAt: Long = System.currentTimeMillis()
        )

        @Dao
        interface MyGoalDao {
            @Query("SELECT * FROM goals ORDER BY updatedAt DESC")
            fun getAllGoals(): Flow<List<GoalEntity>>
            @Query("SELECT * FROM notebook_pages ORDER BY pageOrder ASC, updatedAt DESC")
            fun getAllPages(): Flow<List<NotebookPageEntity>>
            @Insert(onConflict = OnConflictStrategy.REPLACE)
            suspend fun saveGoal(goal: GoalEntity)
            @Delete
            suspend fun deleteGoal(goal: GoalEntity)
            @Insert(onConflict = OnConflictStrategy.REPLACE)
            suspend fun savePage(page: NotebookPageEntity)
            @Delete
            suspend fun deletePage(page: NotebookPageEntity)
            @Query("DELETE FROM goals")
            suspend fun clearAllGoals()
        }

        @Database(entities = [GoalEntity::class, NotebookPageEntity::class], version = 1, exportSchema = false)
        abstract class MyGoalDatabase : RoomDatabase() {
            abstract fun dao(): MyGoalDao
        }

        val drawerColors = listOf(0xFFE6EEF8, 0xFFEDE8F8, 0xFFE6F4EA, 0xFFFFF2DE, 0xFFFCE8E8, 0xFFE3F4F4, 0xFFF4EFE6, 0xFFEFE8F4)
        val drawerIcons = mapOf(
            "Star" to Icons.Default.Star, "Book" to Icons.Default.MenuBook, "Fitness" to Icons.Default.FitnessCenter,
            "Work" to Icons.Default.Work, "Idea" to Icons.Default.Lightbulb, "School" to Icons.Default.School,
            "Rocket" to Icons.Default.RocketLaunch, "Heart" to Icons.Default.Favorite, "Trophy" to Icons.Default.EmojiEvents
        )

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val db = Room.databaseBuilder(applicationContext, MyGoalDatabase::class.java, "my_goal_cabinet.db").build()
                val prefs = getSharedPreferences("mygoal_prefs", Context.MODE_PRIVATE)
                setContent {
                    var isAr by remember { mutableStateOf(prefs.getBoolean("is_ar", true)) }
                    var isDark by remember { mutableStateOf(prefs.getBoolean("is_dark", false)) }
                    val scheme = if (isDark) darkColorScheme(primary = Color(0xFF9BB4FF), background = Color(0xFF111520), surface = Color(0xFF1A2030))
                    else lightColorScheme(primary = Color(0xFF1B2A4A), secondary = Color(0xFF6C63FF), background = Color(0xFFFAF8F5), surface = Color(0xFFEDE8DF))
                    CompositionLocalProvider(LocalLayoutDirection provides if (isAr) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                        MaterialTheme(colorScheme = scheme) {
                            Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                MyGoalCabinetApp(db.dao(), isAr, isDark,
                                    onLang = { isAr = it; prefs.edit().putBoolean("is_ar", it).apply() },
                                    onTheme = { isDark = it; prefs.edit().putBoolean("is_dark", it).apply() }
                                )
                            }
                        }
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun MyGoalCabinetApp(dao: MyGoalDao, isAr: Boolean, isDark: Boolean, onLang: (Boolean) -> Unit, onTheme: (Boolean) -> Unit) {
            val scope = rememberCoroutineScope()
            val context = LocalContext.current
            val goals by dao.getAllGoals().collectAsState(initial = emptyList())
            val allPages by dao.getAllPages().collectAsState(initial = emptyList())

            var screen by remember { mutableStateOf("home") }
            var currentGoalId by remember { mutableStateOf<String?>(null) }
            var currentPageId by remember { mutableStateOf<String?>(null) }
            var editingGoal by remember { mutableStateOf<GoalEntity?>(null) }
            var searchQuery by remember { mutableStateOf("") }

            val activeGoals = goals.filter { it.status == "ACTIVE" }
            val completedGoals = goals.filter { it.status == "COMPLETED" }
            val archivedGoals = goals.filter { it.status == "ARCHIVED" }
            val currentGoal = goals.find { it.id == currentGoalId }
            val goalPages = allPages.filter { it.goalId == currentGoalId }.sortedBy { it.pageOrder }
            val currentPage = allPages.find { it.id == currentPageId }

            val exportLauncher = rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/json")) { uri: Uri? ->
                uri?.let {
                    scope.launch {
                        val root = JSONObject().apply {
                            put("goals", JSONArray().apply { goals.forEach { g -> put(JSONObject().apply { put("id", g.id); put("title", g.title); put("description", g.description); put("icon", g.icon); put("color", g.color); put("status", g.status); put("createdAt", g.createdAt) }) } })
                            put("pages", JSONArray().apply { allPages.forEach { p -> put(JSONObject().apply { put("id", p.id); put("goalId", p.goalId); put("title", p.title); put("content", p.content); put("pageOrder", p.pageOrder) }) } })
                        }
                        context.contentResolver.openOutputStream(it)?.use { out -> out.write(root.toString(2).toByteArray()) }
                        Toast.makeText(context, if (isAr) "تم تصدير النسخة الاحتياطية" else "Backup exported", Toast.LENGTH_SHORT).show()
                    }
                }
            }

            val importLauncher = rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument()) { uri: Uri? ->
                uri?.let {
                    scope.launch {
                        runCatching {
                            val txt = context.contentResolver.openInputStream(it)?.bufferedReader()?.readText() ?: ""
                            val root = JSONObject(txt)
                            dao.clearAllGoals()
                            val gArr = root.getJSONArray("goals")
                            for (i in 0 until gArr.length()) {
                                val o = gArr.getJSONObject(i)
                                dao.saveGoal(GoalEntity(id = o.getString("id"), title = o.getString("title"), description = o.optString("description"), icon = o.optString("icon", "Star"), color = o.optLong("color", 0xFFE6EEF8), status = o.optString("status", "ACTIVE"), createdAt = o.optLong("createdAt", System.currentTimeMillis())))
                            }
                            val pArr = root.getJSONArray("pages")
                            for (i in 0 until pArr.length()) {
                                val o = pArr.getJSONObject(i)
                                dao.savePage(NotebookPageEntity(id = o.getString("id"), goalId = o.getString("goalId"), title = o.getString("title"), content = o.optString("content"), pageOrder = o.optInt("pageOrder", i)))
                            }
                            Toast.makeText(context, if (isAr) "تمت الاستعادة بنجاح" else "Restored successfully", Toast.LENGTH_SHORT).show()
                        }
                    }
                }
            }

            Scaffold(
                topBar = {
                    if (screen != "editor") {
                        TopAppBar(
                            title = {
                                Column {
                                    Text("MY GOAL", fontWeight = FontWeight.ExtraBold)
                                    Text(if (isAr) "لكل هدف مساحته الخاصة" else "Every Goal Has Its Own Space", fontSize = 11.sp)
                                }
                            },
                            navigationIcon = {
                                if (screen != "home") {
                                    IconButton(onClick = { screen = if (screen == "notebook") "home" else "home" }) {
                                        Icon(Icons.Default.ArrowBack, contentDescription = null)
                                    }
                                }
                            },
                            actions = {
                                IconButton(onClick = { screen = "search" }) { Icon(Icons.Default.Search, null) }
                                IconButton(onClick = { screen = "completed" }) { Icon(Icons.Default.DoneAll, null) }
                                IconButton(onClick = { screen = "archived" }) { Icon(Icons.Default.Folder, null) }
                                IconButton(onClick = { screen = "settings" }) { Icon(Icons.Default.Settings, null) }
                            }
                        )
                    }
                },
                floatingActionButton = {
                    if (screen == "home") {
                        ExtendedFloatingActionButton(
                            onClick = { editingGoal = null; screen = "goal_form" },
                            icon = { Icon(Icons.Default.Add, null) },
                            text = { Text(if (isAr) "درج هدف جديد" else "New Goal Drawer") }
                        )
                    } else if (screen == "notebook" && currentGoal != null) {
                        ExtendedFloatingActionButton(
                            onClick = {
                                scope.launch {
                                    val newPage = NotebookPageEntity(goalId = currentGoal.id, title = if (isAr) "صفحة جديدة ${goalPages.size + 1}" else "New Page ${goalPages.size + 1}", pageOrder = goalPages.size)
                                    dao.savePage(newPage)
                                    currentPageId = newPage.id
                                    screen = "editor"
                                }
                            },
                            icon = { Icon(Icons.Default.Add, null) },
                            text = { Text(if (isAr) "صفحة جديدة" else "New Page") }
                        )
                    }
                }
            ) { pad ->
                Box(modifier = Modifier.padding(pad).fillMaxSize()) {
                    when (screen) {
                        "home" -> CabinetHomeView(activeGoals, completedGoals.size, archivedGoals.size, allPages, isAr,
                            onOpenGoal = { currentGoalId = it.id; screen = "notebook" },
                            onEditGoal = { editingGoal = it; screen = "goal_form" },
                            onStatusChange = { g, st -> scope.launch { dao.saveGoal(g.copy(status = st, updatedAt = System.currentTimeMillis())) } },
                            onDeleteGoal = { g -> scope.launch { dao.deleteGoal(g) } }
                        )
                        "goal_form" -> GoalFormView(editingGoal, isAr, onCancel = { screen = "home" }) { title, desc, icon, color ->
                            scope.launch {
                                val g = editingGoal?.copy(title = title, description = desc, icon = icon, color = color, updatedAt = System.currentTimeMillis())
                                    ?: GoalEntity(title = title, description = desc, icon = icon, color = color)
                                dao.saveGoal(g)
                                if (editingGoal == null) {
                                    dao.savePage(NotebookPageEntity(goalId = g.id, title = if (isAr) "الصفحة الأولى" else "First Page", pageOrder = 0))
                                }
                                screen = "home"
                            }
                        }
                        "notebook" -> currentGoal?.let { g ->
                            NotebookView(g, goalPages, isAr,
                                onOpenPage = { currentPageId = it.id; screen = "editor" },
                                onEditGoal = { editingGoal = g; screen = "goal_form" },
                                onDuplicatePage = { p -> scope.launch { dao.savePage(p.copy(id = UUID.randomUUID().toString(), title = "${p.title} (2)", pageOrder = goalPages.size)) } },
                                onDeletePage = { p -> scope.launch { dao.deletePage(p) } }
                            )
                        }
                        "editor" -> if (currentGoal != null && currentPage != null) {
                            PageEditorView(currentGoal, currentPage, goalPages, isAr,
                                onSave = { t, c -> scope.launch { dao.savePage(currentPage.copy(title = t, content = c, updatedAt = System.currentTimeMillis())) } },
                                onSwitchPage = { currentPageId = it.id },
                                onBack = { screen = "notebook" }
                            )
                        }
                        "search" -> SearchView(searchQuery, { searchQuery = it }, goals, allPages, isAr,
                            onOpenGoal = { currentGoalId = it.id; screen = "notebook" },
                            onOpenPage = { currentGoalId = it.goalId; currentPageId = it.id; screen = "editor" }
                        )
                        "completed" -> StatusGoalListView(if (isAr) "الأهداف المكتملة" else "Completed Goals", completedGoals, isAr,
                            onOpen = { currentGoalId = it.id; screen = "notebook" },
                            onRestore = { scope.launch { dao.saveGoal(it.copy(status = "ACTIVE")) } },
                            onDelete = { scope.launch { dao.deleteGoal(it) } }
                        )
                        "archived" -> StatusGoalListView(if (isAr) "الأهداف المؤرشفة" else "Archived Goals", archivedGoals, isAr,
                            onOpen = { currentGoalId = it.id; screen = "notebook" },
                            onRestore = { scope.launch { dao.saveGoal(it.copy(status = "ACTIVE")) } },
                            onDelete = { scope.launch { dao.deleteGoal(it) } }
                        )
                        "settings" -> SettingsBackupView(isAr, isDark, onLang, onTheme,
                            onExport = { exportLauncher.launch("my_goal_backup.json") },
                            onImport = { importLauncher.launch(arrayOf("application/json", "*/*")) }
                        )
                    }
                }
            }
        }

        @Composable
        fun CabinetHomeView(goals: List<GoalEntity>, compCount: Int, archCount: Int, allPages: List<NotebookPageEntity>, isAr: Boolean, onOpenGoal: (GoalEntity) -> Unit, onEditGoal: (GoalEntity) -> Unit, onStatusChange: (GoalEntity, String) -> Unit, onDeleteGoal: (GoalEntity) -> Unit) {
            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                item {
                    Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        StatChip(if (isAr) "نشطة: ${goals.size}" else "Active: ${goals.size}", Modifier.weight(1f))
                        StatChip(if (isAr) "مكتملة: $compCount" else "Done: $compCount", Modifier.weight(1f))
                        StatChip(if (isAr) "مؤرشفة: $archCount" else "Archived: $archCount", Modifier.weight(1f))
                    }
                }
                item {
                    Column(
                        modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(22.dp)).background(MaterialTheme.colorScheme.surface).border(2.dp, Color(0xFFD8D0C5), RoundedCornerShape(22.dp)).padding(14.dp),
                        verticalArrangement = Arrangement.spacedBy(12.dp)
                    ) {
                        Text(if (isAr) "خزانة الأهداف التفاعلية" else "Interactive Goal Cabinet", fontWeight = FontWeight.Bold, fontSize = 15.sp)
                        if (goals.isEmpty()) {
                            Box(modifier = Modifier.fillMaxWidth().padding(32.dp), contentAlignment = Alignment.Center) {
                                Text(if (isAr) "الخزانة فارغة. اضغط + لإضافة أول درج هدف!" else "Cabinet is empty. Tap + to add your first goal drawer!")
                            }
                        } else {
                            goals.forEach { goal ->
                                val pCount = allPages.count { it.goalId == goal.id }
                                var menuOpen by remember { mutableStateOf(false) }
                                Card(
                                    modifier = Modifier.fillMaxWidth().clickable { onOpenGoal(goal) },
                                    shape = RoundedCornerShape(16.dp),
                                    colors = CardDefaults.cardColors(containerColor = Color(goal.color))
                                ) {
                                    Column(modifier = Modifier.padding(14.dp)) {
                                        Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                                            Icon(drawerIcons[goal.icon] ?: Icons.Default.Star, null, tint = Color(0xFF1B2A4A))
                                            Spacer(Modifier.width(10.dp))
                                            Column(modifier = Modifier.weight(1f)) {
                                                Text(goal.title, fontWeight = FontWeight.ExtraBold, fontSize = 17.sp, color = Color(0xFF1B2A4A))
                                                if (goal.description.isNotBlank()) Text(goal.description, fontSize = 13.sp, color = Color(0xFF3A4860), maxLines = 1, overflow = TextOverflow.Ellipsis)
                                            }
                                            Text("$pCount ${if (isAr) "صفحات" else "pages"}", fontSize = 12.sp, color = Color(0xFF1B2A4A))
                                            Box {
                                                IconButton(onClick = { menuOpen = true }) { Icon(Icons.Default.MoreVert, null, tint = Color(0xFF1B2A4A)) }
                                                DropdownMenu(expanded = menuOpen, onDismissRequest = { menuOpen = false }) {
                                                    DropdownMenuItem(text = { Text(if (isAr) "تعديل الدرج" else "Edit Drawer") }, onClick = { menuOpen = false; onEditGoal(goal) })
                                                    DropdownMenuItem(text = { Text(if (isAr) "تحديد كمكتمل" else "Mark Completed") }, onClick = { menuOpen = false; onStatusChange(goal, "COMPLETED") })
                                                    DropdownMenuItem(text = { Text(if (isAr) "نقل للأرشيف" else "Archive") }, onClick = { menuOpen = false; onStatusChange(goal, "ARCHIVED") })
                                                    DropdownMenuItem(text = { Text(if (isAr) "حذف" else "Delete") }, onClick = { menuOpen = false; onDeleteGoal(goal) })
                                                }
                                            }
                                        }
                                        Spacer(Modifier.height(8.dp))
                                        Box(modifier = Modifier.align(Alignment.CenterHorizontally).width(64.dp).height(7.dp).clip(CircleShape).background(Color(0xFF8C96A8)))
                                    }
                                }
                            }
                        }
                    }
                }
                item { Spacer(Modifier.height(72.dp)) }
            }
        }

        @Composable
        fun StatChip(label: String, modifier: Modifier = Modifier) {
            Surface(modifier = modifier, shape = RoundedCornerShape(12.dp), color = MaterialTheme.colorScheme.surface) {
                Box(modifier = Modifier.padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                    Text(label, fontWeight = FontWeight.SemiBold, fontSize = 13.sp)
                }
            }
        }

        @Composable
        fun GoalFormView(editing: GoalEntity?, isAr: Boolean, onCancel: () -> Unit, onSave: (String, String, String, Long) -> Unit) {
            var title by remember { mutableStateOf(editing?.title ?: "") }
            var desc by remember { mutableStateOf(editing?.description ?: "") }
            var icon by remember { mutableStateOf(editing?.icon ?: "Star") }
            var color by remember { mutableStateOf(editing?.color ?: drawerColors.first()) }

            Column(modifier = Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                Text(if (editing == null) (if (isAr) "إنشاء درج هدف جديد" else "Create New Goal Drawer") else (if (isAr) "تعديل الدرج" else "Edit Goal Drawer"), fontWeight = FontWeight.Bold, fontSize = 20.sp)
                OutlinedTextField(value = title, onValueChange = { title = it }, label = { Text(if (isAr) "اسم الهدف (مطلوب)" else "Goal Name (Required)") }, modifier = Modifier.fillMaxWidth())
                OutlinedTextField(value = desc, onValueChange = { desc = it }, label = { Text(if (isAr) "وصف قصير (اختياري)" else "Short Description (Optional)") }, modifier = Modifier.fillMaxWidth())
                Text(if (isAr) "لون الدرج" else "Drawer Color", fontWeight = FontWeight.SemiBold)
                LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    items(drawerColors) { c ->
                        Box(modifier = Modifier.size(42.dp).clip(CircleShape).background(Color(c)).border(if (color == c) 3.dp else 1.dp, Color(0xFF1B2A4A), CircleShape).clickable { color = c })
                    }
                }
                Text(if (isAr) "أيقونة الدرج" else "Drawer Icon", fontWeight = FontWeight.SemiBold)
                LazyRow(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                    items(drawerIcons.keys.toList()) { k ->
                        Surface(shape = RoundedCornerShape(12.dp), color = if (icon == k) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.surface, modifier = Modifier.clickable { icon = k }) {
                            Icon(drawerIcons[k]!!, null, modifier = Modifier.padding(12.dp), tint = if (icon == k) Color.White else MaterialTheme.colorScheme.onSurface)
                        }
                    }
                }
                Row(horizontalArrangement = Arrangement.spacedBy(10.dp), modifier = Modifier.fillMaxWidth()) {
                    OutlinedButton(onClick = onCancel, modifier = Modifier.weight(1f)) { Text(if (isAr) "إلغاء" else "Cancel") }
                    Button(onClick = { if (title.isNotBlank()) onSave(title.trim(), desc.trim(), icon, color) }, enabled = title.isNotBlank(), modifier = Modifier.weight(1f)) {
                        Text(if (isAr) "حفظ الدرج" else "Save Drawer")
                    }
                }
            }
        }

        @Composable
        fun NotebookView(goal: GoalEntity, pages: List<NotebookPageEntity>, isAr: Boolean, onOpenPage: (NotebookPageEntity) -> Unit, onEditGoal: () -> Unit, onDuplicatePage: (NotebookPageEntity) -> Unit, onDeletePage: (NotebookPageEntity) -> Unit) {
            var filter by remember { mutableStateOf("") }
            val df = remember { SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.getDefault()) }
            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                item {
                    Card(colors = CardDefaults.cardColors(containerColor = Color(goal.color)), shape = RoundedCornerShape(18.dp), modifier = Modifier.fillMaxWidth()) {
                        Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                            Icon(drawerIcons[goal.icon] ?: Icons.Default.Star, null, tint = Color(0xFF1B2A4A), modifier = Modifier.size(32.dp))
                            Spacer(Modifier.width(12.dp))
                            Column(modifier = Modifier.weight(1f)) {
                                Text(goal.title, fontWeight = FontWeight.ExtraBold, fontSize = 19.sp, color = Color(0xFF1B2A4A))
                                if (goal.description.isNotBlank()) Text(goal.description, fontSize = 13.sp, color = Color(0xFF3A4860))
                            }
                            IconButton(onClick = onEditGoal) { Icon(Icons.Default.Edit, null, tint = Color(0xFF1B2A4A)) }
                        }
                    }
                }
                item {
                    OutlinedTextField(value = filter, onValueChange = { filter = it }, leadingIcon = { Icon(Icons.Default.Search, null) }, placeholder = { Text(if (isAr) "ابحث داخل صفحات هذا الدفتر..." else "Search inside this notebook...") }, modifier = Modifier.fillMaxWidth())
                }
                val shown = pages.filter { filter.isBlank() || it.title.contains(filter, true) || it.content.contains(filter, true) }
                items(shown) { p ->
                    Card(modifier = Modifier.fillMaxWidth().clickable { onOpenPage(p) }, shape = RoundedCornerShape(14.dp)) {
                        Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                            Column(modifier = Modifier.weight(1f)) {
                                Text(p.title.ifBlank { if (isAr) "صفحة بدون عنوان" else "Untitled Page" }, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                if (p.content.isNotBlank()) Text(p.content, maxLines = 2, overflow = TextOverflow.Ellipsis, fontSize = 13.sp)
                                Text(df.format(Date(p.updatedAt)), fontSize = 11.sp, color = Color.Gray)
                            }
                            IconButton(onClick = { onDuplicatePage(p) }) { Icon(Icons.Default.ContentCopy, null) }
                            IconButton(onClick = { onDeletePage(p) }) { Icon(Icons.Default.Delete, null) }
                        }
                    }
                }
                item { Spacer(Modifier.height(72.dp)) }
            }
        }

        @Composable
        fun PageEditorView(goal: GoalEntity, page: NotebookPageEntity, allGoalPages: List<NotebookPageEntity>, isAr: Boolean, onSave: (String, String) -> Unit, onSwitchPage: (NotebookPageEntity) -> Unit, onBack: () -> Unit) {
            var title by remember(page.id) { mutableStateOf(page.title) }
            var content by remember(page.id) { mutableStateOf(page.content) }
            var focusMode by remember { mutableStateOf(false) }
            var showSwitcher by remember { mutableStateOf(false) }
            val undoStack = remember(page.id) { mutableStateListOf<String>() }

            LaunchedEffect(title, content) {
                delay(350)
                onSave(title, content)
            }

            Column(modifier = Modifier.fillMaxSize().padding(12.dp)) {
                Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                    IconButton(onClick = { onSave(title, content); onBack() }) { Icon(Icons.Default.ArrowBack, null) }
                    Text(goal.title, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f), maxLines = 1)
                    TextButton(onClick = { showSwitcher = !showSwitcher }) { Text("${allGoalPages.size} ${if (isAr) "صفحات" else "Pages"}") }
                    IconButton(onClick = { if (undoStack.isNotEmpty()) content = undoStack.removeLast() }) { Icon(Icons.Default.Undo, null) }
                    IconButton(onClick = { focusMode = !focusMode }) { Icon(Icons.Default.Visibility, null) }
                }
                AnimatedVisibility(visible = showSwitcher) {
                    LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(vertical = 6.dp)) {
                        items(allGoalPages) { p ->
                            FilterChip(selected = p.id == page.id, onClick = { onSave(title, content); onSwitchPage(p) }, label = { Text(p.title) })
                        }
                    }
                }
                AnimatedVisibility(visible = !focusMode) {
                    LazyRow(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n# " }, label = { Text("H1") }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n## " }, label = { Text("H2") }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += " **نص عريض** " }, label = { Icon(Icons.Default.FormatBold, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += " *مائل* " }, label = { Icon(Icons.Default.FormatItalic, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n• " }, label = { Icon(Icons.Default.FormatListBulleted, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n☑ " }, label = { Icon(Icons.Default.CheckCircle, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n❝ اقتباس ❞\n" }, label = { Icon(Icons.Default.FormatQuote, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += "\n| عمود 1 | عمود 2 |\n| --- | --- |\n| خلية | خلية |\n" }, label = { Icon(Icons.Default.TableChart, null) }) }
                        item { AssistChip(onClick = { undoStack.add(content); content += " [رابط](https://) " }, label = { Icon(Icons.Default.Link, null) }) }
                    }
                }
                OutlinedTextField(
                    value = title,
                    onValueChange = { title = it },
                    placeholder = { Text(if (isAr) "عنوان الصفحة..." else "Page Title...") },
                    textStyle = LocalTextStyle.current.copy(fontWeight = FontWeight.Bold, fontSize = 20.sp),
                    modifier = Modifier.fillMaxWidth()
                )
                Spacer(Modifier.height(8.dp))
                OutlinedTextField(
                    value = content,
                    onValueChange = { undoStack.add(content); content = it },
                    placeholder = { Text(if (isAr) "مساحة حرة تماماً... اكتب خططك، ملاحظاتك، قوائمك، أو جداولك بحرية" else "100% Free-form space... write notes, lists, tables freely") },
                    modifier = Modifier.fillMaxWidth().weight(1f)
                )
            }
        }

        @Composable
        fun SearchView(query: String, onQuery: (String) -> Unit, goals: List<GoalEntity>, pages: List<NotebookPageEntity>, isAr: Boolean, onOpenGoal: (GoalEntity) -> Unit, onOpenPage: (NotebookPageEntity) -> Unit) {
            Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                OutlinedTextField(value = query, onValueChange = onQuery, leadingIcon = { Icon(Icons.Default.Search, null) }, placeholder = { Text(if (isAr) "بحث شامل في كل الأهداف والصفحات..." else "Global search across all goals and pages...") }, modifier = Modifier.fillMaxWidth())
                val mGoals = goals.filter { query.isNotBlank() && (it.title.contains(query, true) || it.description.contains(query, true)) }
                val mPages = pages.filter { query.isNotBlank() && (it.title.contains(query, true) || it.content.contains(query, true)) }
                LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                    items(mGoals) { g ->
                        Card(modifier = Modifier.fillMaxWidth().clickable { onOpenGoal(g) }) {
                            Text("🗄️ ${g.title}", modifier = Modifier.padding(14.dp), fontWeight = FontWeight.Bold)
                        }
                    }
                    items(mPages) { p ->
                        Card(modifier = Modifier.fillMaxWidth().clickable { onOpenPage(p) }) {
                            Column(modifier = Modifier.padding(14.dp)) {
                                Text("📄 ${p.title}", fontWeight = FontWeight.Bold)
                                Text(p.content, maxLines = 2, fontSize = 12.sp)
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun StatusGoalListView(header: String, list: List<GoalEntity>, isAr: Boolean, onOpen: (GoalEntity) -> Unit, onRestore: (GoalEntity) -> Unit, onDelete: (GoalEntity) -> Unit) {
            LazyColumn(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                item { Text(header, fontWeight = FontWeight.Bold, fontSize = 20.sp) }
                items(list) { g ->
                    Card(modifier = Modifier.fillMaxWidth().clickable { onOpen(g) }, colors = CardDefaults.cardColors(containerColor = Color(g.color))) {
                        Row(modifier = Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                            Text(g.title, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f), color = Color(0xFF1B2A4A))
                            IconButton(onClick = { onRestore(g) }) { Icon(Icons.Default.Restore, null, tint = Color(0xFF1B2A4A)) }
                            IconButton(onClick = { onDelete(g) }) { Icon(Icons.Default.Delete, null, tint = Color(0xFF1B2A4A)) }
                        }
                    }
                }
            }
        }

        @Composable
        fun SettingsBackupView(isAr: Boolean, isDark: Boolean, onLang: (Boolean) -> Unit, onTheme: (Boolean) -> Unit, onExport: () -> Unit, onImport: () -> Unit) {
            Column(modifier = Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                Text(if (isAr) "الإعدادات والنسخ الاحتياطي" else "Settings & Backup", fontWeight = FontWeight.Bold, fontSize = 20.sp)
                Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                    Text(if (isAr) "اللغة العربية (RTL)" else "Arabic Language (RTL)", modifier = Modifier.weight(1f))
                    Switch(checked = isAr, onCheckedChange = onLang)
                }
                Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.fillMaxWidth()) {
                    Text(if (isAr) "الوضع الليلي (Dark Mode)" else "Dark Mode", modifier = Modifier.weight(1f))
                    Switch(checked = isDark, onCheckedChange = onTheme)
                }
                Divider()
                Button(onClick = onExport, modifier = Modifier.fillMaxWidth()) { Text(if (isAr) "تصدير نسخة احتياطية (JSON)" else "Export Backup (JSON)") }
                OutlinedButton(onClick = onImport, modifier = Modifier.fillMaxWidth()) { Text(if (isAr) "استعادة نسخة احتياطية (JSON)" else "Restore Backup (JSON)") }
                Divider()
                Text("MY GOAL v1.0.0 — Every Goal Has Its Own Space", fontSize = 12.sp, color = Color.Gray)
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyGoal-Android-APK
        path: app/build/outputs/apk/debug/app-debug.apk
